name: thinking_op
version: v1.1
model: text
description: 推理题结构化意图生成：读题 + 表格上下文，输出单个计算操作 JSON（替代任意代码生成）
template: |
  把用户问题转换成 ONE 个计算操作 JSON（只输出 JSON，不要解释、不要代码块）。

  表格所在页码：{{ page }}
  表格列名：{{ columns }}
  首列全量行名（按表格顺序；"其中："开头的行是其上一主科目的子项）：
  {{ rows }}

  用户问题：{{ question }}

  可用操作（选一个）：
  - {"op": "cell", "row": "行名关键词", "col": "列名关键词"}
      取一个格子的值
  - {"op": "cells", "refs": [{"row": "...", "col": "..."}, {"row": "...", "col": "..."}]}
      依次取多个格子（如"本期和上期分别是多少"= 同一行两个列）
  - {"op": "diff", "a": {"row": "...", "col": "..."}, "b": {"row": "...", "col": "..."}}
      a 减 b（如"去除X后的Y"= Y合计 - X）
  - {"op": "sum", "col": "列名关键词", "rows": ["行名关键词", "..."]}
      指定行求和；rows 省略时对整列非空数值求和；
      跨列格子相加改用 {"op": "sum", "refs": [格1, 格2]}，
      如"X 的欧洲与亚洲销量合计"= 同一行的两个列相加
  - {"op": "avg", "refs": [{"row": "...", "col": "..."}, ...]}
      或 {"op": "avg", "col": "列名关键词", "rows": ["行名关键词", "..."]}
      求平均："平均值/均值是多少"必须用 avg（不要用 cells 只罗列操作数）
  - {"op": "ratio_sum", "num_col": "分子列名", "den_col": "分母列名", "rows": ["行名关键词", "..."]}
      加权比：Σ分子列 / Σ分母列 ×100（"合计后比率/比例是多少"类题——
      比例列简单相加是语义错误，必须用对应金额列加权）
  - {"op": "contains", "text": "关键词"}
      全表存在性判断：扫描全表所有格子（含非首列），命中返回"是"，
      否则"否"。"是否包含/是否含X"类子问一律用它（证据常在标签格、
      备注格里，如"评审记录/自由调整/复盘"），不要用 const 直接猜
  - {"op": "const", "value": 常量}
      常量答案：页码（用上方"表格所在页码"）、存在性判断"是/否"
      （仅限上方行名/列名列表中一眼可证的情形）、表中不存在的字段答 "[MASK]"
  - {"op": "seq", "ops": [子op1, 子op2, ...]}
      复合题（一题多问，"请按顺序列出A、B、C"）：每个子问一个子 op，
      按问序排列，返回各子结果列表
  - {"op": "count", "contains": "关键词", "col": "列名关键词"}
      计数：col 省略时统计首列匹配行数；指定 col 时统计该列中
      匹配关键词的格子数（匹配容忍单字差异，"红色"可匹配表内"红"）
  - {"op": "subitems", "item": "主科目名关键词"}
      列举目标行的子项/组成项：若目标是区块标题——中文序号（"一、营业总收入"）、
      括号序号（"（一）综合收益总额"）或冒号分组（"非流动负债："）——
      返回该区块内到下一同级区块（或"合计"行）之前的全部行名；
      若是普通科目（如"应付债券"），返回其紧邻的"其中："子项（去掉前缀）
  - {"op": "nonzero", "col": "列名关键词", "after_row": "起始行关键词"}
      按值筛选行：返回该列有非零数值的行名列表（如"哪些项今年有增减变动"）；
      after_row 可选——从该行之后开始统计（排除余额/标题区块，只留变动项）

  规则：
  - row/col 填表格原文中的关键词（可以少字，不可以错字）；
  - 枚举/列举题（"X包括哪几部分""X有哪些"）用 subitems；
  - "A比B多/少多少""去除A的B"用 diff；纯取数用 cell/cells；
    计数用 count；平均/均值用 avg；占比/比例列求合计用 ratio_sum；
  - seq 复合题中的"是否含/是否包含X"子问必须用 contains 逐个实查，
    禁止未经扫描直接输出 const"否"（qid=538 实测三项全误判）。
