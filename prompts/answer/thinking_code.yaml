name: thinking_code
version: v1.2
model: text
description: 推理题代码生成：读题 + DataFrame 上下文，生成 pandas 计算代码
template: |
  DataFrame `df` 是表格数据（多级表头已展平为 "父:子" 列名，合并单元格已展开填充，
  数字已转数值；不可辨认单元格在 df 中为 NaN）。

  列名：{{ columns }}
  前 3 行：
  {{ head }}
  首列全量行名（按表格顺序；"其中："开头的行是其上一主科目的子项）：
  {{ rows }}

  用户问题：{{ question }}

  请生成 pandas 代码完成计算，规则：
  - 只用 df / pd / np 与内置函数（len/sum/round/max/min/sorted/abs）；
  - 禁止 import、open、网络访问；
  - 最后一个表达式或 result 变量即答案，类型必须是 str/int/float/list 之一；
  - 计数题用 len()；求和/差/比例/平均直接算，题目要求的精度（如"保留两位小数"）由外部处理，
    代码返回原始数值；
  - 枚举/列举题（如"X包括哪几部分""X有哪些"）：判断目标行的类型——
    区块标题（中文序号"一、"、括号序号"（一）"、冒号分组"非流动负债："）则收集
    到下一同级区块或"合计"行之前的全部行名；普通科目（如"应付债券"）则仅取其
    紧邻的"其中："开头子行（遇第一个非"其中："有值行停止）；目标行后无子项时
    result 返回 []，不要把别处的子项算进来；
  - 若需单位换算（表为万元、题目要元），显式乘系数；
  - df 中的 NaN（不可辨认单元格）在计数/求和时跳过（dropna 或 sum 默认行为），不要报错；
  - 代码要短，直接给出计算路径，不要冗长推导；
  - 不要输出任何解释，只输出代码。
