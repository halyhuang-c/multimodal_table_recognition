name: range_parse
version: v1.0
model: text
description: 解析题目中的页/行/列范围描述为结构化 JSON
template: |
  将表格题目中的范围描述解析为 JSON（只输出 JSON，不要解释）：
  {"page_range": [start, end] | null, "row_range": [start, end] | null, "col_range": [start, end] | null}

  规则：
  - 页码 1 起始、行列索引 0 起始，均含端点；
  - 题目未提及的维度填 null；
  - "第一行/前1行" = row_range [0, 0]；"前N行" = [0, N-1]；"前N列" = [0, N-1]；
  - "表头行" = row_range 取 [0, 1]（两层表头时 [0, 1]，单层 [0, 0]，按描述判断）；
  - "整张表/全部" 三个 range 均为 null；
  - "第X行到第Y行" = [X-1, Y-1]（题面若为 1 起始表述）。

  题目：{{ question }}
  补充说明：{{ answer_format }}
