name: extract
version: v1.6
model: text
description: 内容提取：定位依据 + 取值，输出 JSON
template: |
  下面是一张表格的 HTML 表示。{{ table_name_clause }}{{ unit_clause }}{{ format_note }}
  用户问题：{{ question }}

  请以 JSON 输出（只输出 JSON，不要解释）：
  {"locate": {"row_header": "...", "col_header": "...", "header_path": "..."},
   "value": "...", "reason": "一句话"}

  规则：
  - value 必须原样来自表格文本；多值问题 value 用 JSON 数组；
  - 数值答案去掉千分位逗号（填 125000，不填 125,000）；
  - 枚举类题目（"列出所有/有哪些/分别"等要求多个条目）：逐行扫描全表，
    value 数组必须包含表中全部满足题意的行，按表格行序排列，禁止提前停止；
    目标列为空的行跳过，不要用空串占位；
  - "哪种/哪个…最多(最少)/最高(最低)/最大(最小)"比较极值类问题
    （含"找出…最高的X"句式）：value 只输出唯一的行标题
    （单个字符串），多个并列时才用数组；reason 中必须先逐一列出全部
    候选行的计算值（覆盖每一行，禁止跳过），再选出极值，避免漏算
    （qid=702 实测漏 TB8 误选 TB7；qid=667 实测把整列值/全部行名
    当 value，未选极值行）；
  - "有多少个/数量是几"计数类问题：value 只输出一个整数；
    命中行名单放在 reason 中，不要把名单作为 value（qid=703 实测）；
  - "是否含/是否包含/有没有X"存在性问题：value 只输出"是"或"否"；
    判定必须以表中可见的标签/字段原文为准——X 与某标签文字一致
    或作为子串出现才答"是"，语义相近但名称不同的概念不算
    （实测："物料编码"≠"商品编号"、"金额列"≠"总价/运费列"、
    "签章"≠"盖章"，此类一律答"否"）；
  - "主表列数"类问题：按表头行可见的独立字段文字数计数，
    colspan 合并展开的同一字段不重复计数（实测合并表 HTML 网格
    列数比可见表头多 1）；
  - 汇总行（合计/小计/总计/汇总）仅在题目明确求总额或汇总时输出，
    枚举明细项时排除汇总行；
  - 标题类问题（问"表的标题/主表或主区域的标题"）：上文已给"本表表名"
    时直接用表名作答；无表名时取表格区域起始处第一行的短文本标题
    （通常为加粗大写的章节起始名，如 ASSETS），不要回答"无标题"，
    也不要用列头文字充当标题（qid=299 实测误取列头）；
  - 无表头列表型表（典型结构：序号 | 名称/项目 | 备注/要求，
    且某一列所有行值相同，如"Attach copy of certificate"）：
    题干问"X项目/X类型/X名称/X活动对应的值"→取**名称列**（非序号、
    非重复值的备注列）；题干问"X要求/X备注/X证明对应的值"→取备注列。
    禁止把名称类问题答成重复的备注值（qid=114/116 实测取错列）；
  - 定位依据（row_header/col_header/header_path）必须真实存在于表头/行标题中；
  - 表格可能是财务/产品/模型跑分等任意领域，按题面语义理解，不要假设特定领域；
  - 涉及单位或字段继承（合并单元格向下继承）时在 reason 说明；
  - 若目标单元格含 [MASK]，value 输出 [MASK]，reason 说明"数据不可辨认"。

  表格 HTML：
  {{ table_html }}
