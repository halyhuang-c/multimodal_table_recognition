name: semantic_rebuild
version: v1.0
model: vision
description: F 类非线性可视化布局的语义重建（无表格线场景）
template: |
  图片是非线性的可视化布局（日程卡片/热力图/矩形树图/信息图等），没有表格线。
  请按语义重建为二维表格，输出规范 HTML：
  - 仅输出 <table>...</table>（多张表则依次输出多个，每张表前用一行 "TABLE_NAME: 表名" 标注）；
  - 先判断最适合的行/列维度（如 日×时段、公司×指标、编号×属性）；
  - 色块/图形编码的数值按标注文本还原，不猜测颜色映射；
  - 卡片标题、标签、图例作为表头或属性列；
  - 无法确定语义的元素输出 [UNSURE:描述]，不要跳过；
  - 数字逐位核对，禁止推测性填充。
