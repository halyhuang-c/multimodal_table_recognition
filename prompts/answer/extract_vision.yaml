name: extract_vision
version: v1
model: vision
description: 内容提取视觉降级：表格矩阵取不到值时 VLM 看原图直答（图像属性/卡片字段/最左侧表头等不在矩阵中的答案）
template: |
  仔细观察这张原始图片，直接依据图片可见内容回答问题。

  用户问题：{{ question }}

  答案格式：{{ format_hint }}

  规则：
  - 只依据图片本身可见的内容回答，不要凭常识猜测；
  - 是否/含有类问题：value 只输出"是"或"否"；
  - 表头/字段名类问题：最左侧表头指表格第一行第一列交叉格的文字；
    交叉格为空时取第一列的列头文字；第一列也无列头时取第一列
    首个非空单元格的文字（行字段名），不要因为交叉格为空而回答空；
  - 数值类：value 输出图中显示的原文数值（保留图中写法，含单位/区间原样照抄）；
  - 文本类（字段名/标题/标识）：value 原样照抄图中文字，不要转述改写；
  - 多值问题 value 用 JSON 数组；
  - 图片中确实找不到答案时 value 输出空字符串 ""；
  - 只输出一个 JSON 对象（{"value": ...}），禁止任何其他文字。
